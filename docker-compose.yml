version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: rental-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: rental_home
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rental-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./rental-management
      dockerfile: Dockerfile
    container_name: rental-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rental_home?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      FILE_UPLOAD_DIR: /app/uploads/
      FILE_TEMP_EXPORT_EXCEL: /app/tmp/
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:80,http://localhost
    volumes:
      - backend_uploads:/app/uploads
      - backend_tmp:/app/tmp
    networks:
      - rental-network

  frontend:
    build:
      context: ./rent-manager-app
      dockerfile: Dockerfile
    container_name: rental-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - rental-network

networks:
  rental-network:
    driver: bridge

volumes:
  mysql_data:
  backend_uploads:
  backend_tmp:
